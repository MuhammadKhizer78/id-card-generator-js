<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ID Card Generator</title>
    <style>
        body{
            margin: 0;
            padding: 20px;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            box-sizing: border-box;
        }
        .main{
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 25px;
            flex-wrap: wrap;
        }
        .container{
            background: white;
            padding: 25px;
            border-radius: 12px;
            width: 320px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .container h1{
            text-align: center;
            margin-bottom: 20px;
        }
        input, select{
            width: 90%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
            outline: none;
        }
        button{
            padding: 10px 15px;
            border: none;
            background: #667eea;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover{
            background: #5563c1;
        }
        .card{
            width: 320px;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .card-header{
            background: #667eea;
            color: white;
            text-align: center;
            padding: 25px;
        }
        .card-body{
            padding: 20px;
            text-align: center;
        }
        .card-body img{
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #667eea;
            margin-top: -70px;
            background: white;
        }
        .card-body h2{
            margin: 10px 0 5px;
        }
        .info{
            text-align: left;
            margin-top: 15px;
        }
        .info p{
            margin: 8px 0;
            font-size: 15px;
        }
        @media (max-width: 750px){
            .main{
                flex-direction: column;
                align-items: center;
            }
            .container,
            .card{
                width: 90%;
            }
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="container">
            <h1>ID Card Generator</h1>
            <input type="text" placeholder="Enter Name" required>
            <input type="number" placeholder="Enter Age" required>
            <input type="text" placeholder="Enter Department / Class" required>
            <select>
                <option value="">Select Status</option>
                <option>Student</option>
                <option>Employee</option>
                <option>Teacher</option>
            </select>
            <input type="text" placeholder="Enter ID Number" required>
            <input type="file" accept="image/*">
            <br>
            <button>Generate Card</button>
        </div>
        <div class="card">
            <div class="card-header">
                <h2>Professional ID Card</h2>
            </div>
            <div class="card-body">
                <img src="https://via.placeholder.com/100" id="profilePic">

                <h2>Your Name</h2>

                <div class="info">
                    <p><strong>Age:</strong> --</p>
                    <p><strong>Department:</strong> --</p>
                    <p><strong>Status:</strong> --</p>
                    <p><strong>ID:</strong> --</p>
                </div>
            </div>
        </div>
    </div>
</body>
<script>
    let inputs = document.querySelectorAll("input");
    let select = document.querySelector("select");
    let btn = document.querySelector("button");
    let cardName = document.querySelector(".card-body h2");
    let info = document.querySelectorAll(".info p");
    let profilePic = document.querySelector("#profilePic");


    function createCard(){
        let name = inputs[0].value;
        let age = inputs[1].value;
        let department = inputs[2].value;
        let idNumber = inputs[3].value;
        let status = select.value;

        if(name === "" || age === "" || department === "" || idNumber === "" || status === ""){
            alert("Please fill all fields!");
        }else{
            cardName.textContent = name;
            info[0].innerHTML = `<strong>Age:</strong> ${age}`;
            info[1].innerHTML = `<strong>Department:</strong> ${department}`;
            info[2].innerHTML = `<strong>Status:</strong> ${status}`;
            info[3].innerHTML = `<strong>ID:</strong> ${idNumber}`;
        }

        let file = inputs[4].files[0];

        if(file){
            let reader = new FileReader();
            reader.onload = function(e){
                profilePic.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }
    }

    btn.addEventListener("click", createCard);
    inputs.forEach(input => {
        input.addEventListener("keypress", (e) => {
            if(e.key === "Enter"){
                createCard();
            }
        });
    });

</script>
</html>
